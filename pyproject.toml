[project]
name = "microplastic-ipd"
version = "0.1.0"
description = "Automated microplastic detection & classification using deep learning"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.3.0",
    "timm>=0.9.0",
    "albumentations>=1.4.1",
    "roboflow>=1.1.0",
    "spectral>=0.23",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pillow>=10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "wandb>=0.15.0",
    "streamlit>=1.28.0",
    "plotly>=5.15.0",
    "reportlab>=4.0.0",
    "statsmodels>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
]

[tool.uv]
# This is an application, not a library. Nothing is published, so uv must not
# try to build a wheel. Imports stay as `from src.models...` from the repo root.
package = false

# Local machines have no GPU -> install the small CPU build of torch (~200 MB
# instead of ~2.5 GB). Colab keeps its own CUDA torch and never reads this file.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests guard their torch/timm imports behind pytest.importorskip, which has to
# run before the `src.*` imports. That ordering is deliberate, not an accident.
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings"
markers = [
    "slow: boots the app in a subprocess; takes tens of seconds because torch and ultralytics are imported",
]