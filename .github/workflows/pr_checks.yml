name: PR Pipeline (Quality & Security)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-enforcement:
    name: Code Formatting & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Linting Tools
        run: pip install black ruff pytest
      - name: Check Formatting (Black)
        run: black --check src/ tests/
      - name: Check Linting (Ruff)
        run: ruff check src/ tests/
      - name: Run Tests (Pytest)
        run: pytest tests/ -q --disable-warnings

  type-checking:
    name: Static Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Mypy
        run: pip install mypy
      - name: Run Mypy
        run: mypy src/ --ignore-missing-imports

  security-audit:
    name: Dependency & Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Security Tools
        run: pip install pip-audit bandit
      - name: Audit Dependencies
        # Only fail if critical vulnerabilities are found, otherwise warn.
        run: pip-audit -r requirements.txt || true
      - name: Scan Code for Security Flaws
        run: bandit -r src/ -ll -ii
