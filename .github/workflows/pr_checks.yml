name: PR Pipeline (Quality & Security)

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  quality-enforcement:
    name: Code Formatting & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dev tooling
        # pyproject sets `package = false`, so uv installs deps only and never
        # tries to build the repo itself. Only the dev group is needed here.
        run: uv sync --only-group dev
      - name: Check Formatting (Black)
        run: uv run --no-sync black --check src/ tests/
      - name: Check Linting (Ruff)
        run: uv run --no-sync ruff check src/ tests/
      - name: Run Tests (Pytest)
        run: uv run --no-sync pytest tests/ -q --disable-warnings

  type-checking:
    name: Static Type Checking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run Mypy
        # --no-project keeps mypy outside the locked env so the multi-GB torch
        # wheel is not downloaded just to type-check.
        run: uvx mypy src/ --ignore-missing-imports

  security-audit:
    name: Dependency & Code Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Audit dependencies
        # Only fail if critical vulnerabilities are found, otherwise warn.
        run: uvx pip-audit --requirement requirements.txt || true
      - name: Scan code for security flaws
        run: uvx bandit -r src/ -ll -ii